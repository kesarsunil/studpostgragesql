version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------------
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: attendance_postgres
    restart: always
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - attendance_net

  # -------------------------------------------------------------------------
  # 2. FastAPI Backend Service
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password123@database:5432/attendance_db
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: student_attendance_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - attendance_net

  # -------------------------------------------------------------------------
  # 3. React Frontend Service (Nginx)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontendd
      dockerfile: Dockerfile
    container_name: attendance_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - attendance_net

# -------------------------------------------------------------------------
# Persistent Volumes & Network Definition
# -------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local

networks:
  attendance_net:
    driver: bridge
